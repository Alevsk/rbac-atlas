name: Image Vulnerability Scan

# Inventories the container images of every chart version that was the latest on/after the
# "since" date plus every version first seen on/after it (scope forward, the default; scope all
# backfills every version, scope latest only the latest ones), scans them with Trivy (SBOM-per-digest cache),
# enriches IDs with cve.now and writes a report (job "scan", read-only, outputs to the workflow
# artifact and caches to actions/cache). Job "publish" turns that artifact into Hugo data under
# data/vulns/ and commits it to master with DAILY_UPDATE_TOKEN so the push triggers deploy-to-pages.
# See docs/image-vulns.md.
on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      scope:
        description: "Chart versions to inventory"
        type: choice
        options: ["forward", "latest", "all"]
        default: "forward"
      since:
        description: "Scope forward: also scan versions whose manifest was first generated on/after this date (YYYY-MM-DD, UTC)"
        default: "2026-11-01"
      limit:
        description: "Only scan the first N images (empty = all)"
        default: ""
      max_new_sboms:
        description: "Maximum new SBOMs generated this run"
        default: "1000"
      cvenow_budget:
        description: "Maximum cve.now HTTP requests this run"
        default: "5000"
      publish:
        description: "Publish data/vulns to master after a successful scan (master only; requires scope forward or all and no limit)"
        type: choice
        options: ["true", "false"]
        default: "true"
      allow_drop:
        description: "Publish even if scanned images/versions drop >20% vs the published data/vulns (needed once to go back to scope forward after an 'all' backfill)"
        type: choice
        options: ["false", "true"]
        default: "false"

permissions:
  contents: read

concurrency:
  group: image-vulns
  cancel-in-progress: false

env:
  TRIVY_VERSION: "0.76.1"
  CRANE_VERSION: "0.22.1"
  VULNS_DIR: vulns

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      # Secrets cannot be referenced in step `if:` conditions; expose only whether they exist.
      HAS_DOCKERHUB_READONLY: ${{ secrets.DOCKERHUB_READONLY_USERNAME != '' && secrets.DOCKERHUB_READONLY_TOKEN != '' }}
    steps:
      - name: Checkout rbac-atlas
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install Trivy (pinned, checksum verified)
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cd "$tmp"
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSLO "${base}/${tarball}"
          curl -fsSLO "${base}/trivy_${TRIVY_VERSION}_checksums.txt"
          grep " ${tarball}\$" "trivy_${TRIVY_VERSION}_checksums.txt" | sha256sum -c -
          tar xzf "${tarball}" trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy
          trivy --version

      - name: Install crane (pinned, checksum verified)
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cd "$tmp"
          base="https://github.com/google/go-containerregistry/releases/download/v${CRANE_VERSION}"
          tarball="go-containerregistry_Linux_x86_64.tar.gz"
          curl -fsSLO "${base}/${tarball}"
          curl -fsSLO "${base}/checksums.txt"
          grep " ${tarball}\$" checksums.txt | sha256sum -c -
          tar xzf "${tarball}" crane
          sudo install -m 0755 crane /usr/local/bin/crane
          crane version

      - name: Compute cache keys
        id: keys
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore Trivy DB cache
        id: trivy-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.keys.outputs.week }}
          restore-keys: trivy-db-

      # Trivy refreshes the DB once its NextUpdate (~1 day) has passed, so the restored cache
      # is mainly a fallback: if the registry fails (e.g. TOOMANYREQUESTS), scan with the
      # restored DB instead of skipping the day. scan.json records db_updated_at either way.
      - name: Download Trivy DBs
        id: trivy-db
        run: |
          set -uo pipefail
          db_dir="${HOME}/.cache/trivy"
          ok=true
          if ! trivy image --download-db-only --no-progress; then
            if [ -f "${db_dir}/db/metadata.json" ]; then
              echo "::warning::Trivy DB download failed; using the DB restored from cache"
              ok=false
            else
              echo "::error::Trivy DB download failed and no cached DB is available"
              exit 1
            fi
          fi
          if ! trivy image --download-java-db-only --no-progress; then
            if [ -f "${db_dir}/java-db/metadata.json" ]; then
              echo "::warning::Trivy Java DB download failed; using the Java DB restored from cache"
              ok=false
            else
              echo "::error::Trivy Java DB download failed and no cached Java DB is available"
              exit 1
            fi
          fi
          echo "fresh=${ok}" >> "$GITHUB_OUTPUT"
          trivy version

      # Saved right after the download (before any scan) so only the DBs are cached,
      # not image layers. The weekly key keeps one entry per ISO week; a stale fallback DB
      # is never saved under a new key.
      - name: Save Trivy DB cache
        if: steps.trivy-cache.outputs.cache-hit != 'true' && steps.trivy-db.outputs.fresh == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.keys.outputs.week }}

      # Each run saves a full snapshot under a new key (run_attempt included so a re-run does not
      # collide with the first attempt's immutable entry). A run that restored nothing saves under
      # the separate "vulns-cold-" prefix, which is only restored when no warm snapshot exists, so
      # a cold snapshot (e.g. after a transient restore failure) never shadows a fuller one.
      - name: Restore vulnscan cache
        id: vulns-cache
        uses: actions/cache/restore@v4
        with:
          path: vulns/.cache
          key: vulns-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vulns-cache-
            vulns-cold-

      # Optional, read-only Docker Hub credentials raise the anonymous pull limit.
      # Deliberately NOT the DOCKERHUB_TOKEN push secret used elsewhere.
      - name: Docker Hub login (read-only, optional)
        if: env.HAS_DOCKERHUB_READONLY == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_READONLY_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_READONLY_TOKEN }}
        run: |
          printf '%s' "$DOCKERHUB_TOKEN" | crane auth login index.docker.io -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Run image vulnerability pipeline
        env:
          INPUT_SCOPE: ${{ inputs.scope }}
          INPUT_SINCE: ${{ inputs.since }}
          INPUT_LIMIT: ${{ inputs.limit }}
          INPUT_MAX_NEW_SBOMS: ${{ inputs.max_new_sboms }}
          INPUT_CVENOW_BUDGET: ${{ inputs.cvenow_budget }}
        run: |
          set -euo pipefail
          # Inputs are empty on scheduled runs; validate them as plain integers before use.
          scope="${INPUT_SCOPE:-forward}"
          since="${INPUT_SINCE:-2026-11-01}"
          limit="${INPUT_LIMIT:-}"
          max_new_sboms="${INPUT_MAX_NEW_SBOMS:-1000}"
          cvenow_budget="${INPUT_CVENOW_BUDGET:-5000}"
          [[ "$scope" == "forward" || "$scope" == "all" || "$scope" == "latest" ]] || { echo "::error::invalid scope: $scope"; exit 1; }
          # vulnscan.inventory also rejects impossible dates such as 2026-13-01
          [[ "$since" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::invalid since date: $since"; exit 1; }
          for v in "$max_new_sboms" "$cvenow_budget" ${limit:+"$limit"}; do
            [[ "$v" =~ ^[0-9]+$ ]] || { echo "::error::invalid numeric input: $v"; exit 1; }
          done
          # Everything below must fit in the job timeout (300 min) with room for the setup steps
          # above and the uploads after, or publish never runs. The scan stage works in batches
          # (resolve -> SBOM -> rematch) and starts no new batch, crane call or SBOM after
          # SCAN_BUDGET_MIN; it can overrun by an in-flight SBOM (11 min) plus a 15-min rematch grace.
          # cve.now (1 rps; a 5000-request budget alone takes ~85 min, a slow or flaky server longer)
          # gets the wall-clock time left until STEP_BUDGET_MIN, minus REPORT_MARGIN_MIN for the report.
          step_start=$(date +%s)
          vars=(VULN_SCOPE="$scope" VULN_SINCE="$since" VULN_LIMIT="$limit")
          make image-inventory scan-images "${vars[@]}" MAX_NEW_SBOMS="$max_new_sboms" SCAN_BUDGET_MIN=165
          STEP_BUDGET_MIN=250
          REPORT_MARGIN_MIN=15
          elapsed_min=$(( ($(date +%s) - step_start) / 60 ))
          cvenow_min=$(( STEP_BUDGET_MIN - REPORT_MARGIN_MIN - elapsed_min ))
          if [ "$cvenow_min" -lt 5 ]; then cvenow_min=5; fi
          echo "scan took ${elapsed_min} min; cve.now time budget ${cvenow_min} min"
          make enrich-vulns vuln-report "${vars[@]}" CVENOW_BUDGET="$cvenow_budget" CVENOW_BUDGET_MIN="$cvenow_min"

      - name: Save vulnscan cache
        if: always() && steps.vulns-cache.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: vulns/.cache
          key: ${{ steps.vulns-cache.outputs.cache-matched-key != '' && 'vulns-cache-' || 'vulns-cold-' }}${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-vulns
          path: vulns/out
          retention-days: 30
          if-no-files-found: warn

      # The publish job only needs these two files. (scan.json is small: per-image vulnerability
      # detail stays in vulns/.cache/match, which the cache step above persists.)
      - name: Upload publish inputs
        uses: actions/upload-artifact@v4
        with:
          name: image-vulns-publish
          path: |
            vulns/out/inventory.json
            vulns/out/summary.json
          retention-days: 7
          if-no-files-found: error

      - name: Job summary
        if: always()
        run: |
          if [ -f vulns/out/report.md ]; then
            cat vulns/out/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report.md produced." >> "$GITHUB_STEP_SUMMARY"
          fi

  # Publishes the scan artifact as Hugo data. Security notes:
  # - The artifact is treated as data only: it is parsed as JSON by vulnscan.publish from the
  #   master checkout; nothing from it is executed.
  # - GITHUB_TOKEN stays read-only. The only write credential is DAILY_UPDATE_TOKEN (a PAT, so
  #   the push triggers deploy-to-pages); it is not persisted in .git/config and is only
  #   exposed to the final commit/push step, never to `make publish-vulns`.
  # - Only data/vulns is staged. Runs only for master (a dispatch from another branch scans
  #   with that branch's code and must not publish).
  # - Only scope forward/all runs without a limit publish: publish rewrites every version shard and
  #   removes the ones it no longer produces, so a scope=latest or limit=N dispatch would wipe the
  #   data of every other version page (inputs are empty on scheduled runs, i.e. scope forward).
  # - vulnscan.publish refuses to write (nothing written or pruned, job fails, no commit) when no
  #   image was scanned, no version has data, or <60% of latest-version images were scanned —
  #   always, also on the first publish and with allow_drop. It also refuses when scanned images,
  #   versions with data or scanned latest-version images drop >20% vs the committed data/vulns,
  #   also across a scope change (so a scheduled forward run never silently deletes a published
  #   scope=all backfill); allow_drop overrides only this relative guard.
  publish:
    needs: scan
    if: >-
      needs.scan.result == 'success' && github.ref == 'refs/heads/master' &&
      inputs.publish != 'false' && inputs.scope != 'latest' && inputs.limit == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      HAS_PUSH_TOKEN: ${{ secrets.DAILY_UPDATE_TOKEN != '' }}
    steps:
      - name: Require push token
        if: env.HAS_PUSH_TOKEN != 'true'
        run: |
          echo "::error::secrets.DAILY_UPDATE_TOKEN is not set; cannot publish"
          exit 1

      - name: Checkout rbac-atlas (master)
        uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Download scan results
        uses: actions/download-artifact@v4
        with:
          name: image-vulns-publish
          path: vulns/out

      - name: Validate scan results
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          out = Path("vulns/out")
          bad = []
          for name in ("inventory.json", "summary.json"):
              f = out / name
              try:
                  if not isinstance(json.loads(f.read_text(encoding="utf-8")), dict):
                      bad.append(f"{name}: not a JSON object")
              except (OSError, ValueError) as exc:
                  bad.append(f"{name}: {exc}")
          for msg in bad:
              print(f"::error::{msg}")
          sys.exit(1 if bad else 0)
          PY

      - name: Build Hugo data
        env:
          INPUT_ALLOW_DROP: ${{ inputs.allow_drop }}
        run: |
          set -euo pipefail
          allow=""
          if [ "${INPUT_ALLOW_DROP:-false}" = "true" ]; then allow=1; fi
          if ! make publish-vulns VULNS_DIR=vulns VULN_ALLOW_DROP="$allow"; then
            echo "::error::vulnscan.publish refused to publish (see the errors above); data/vulns was not changed or committed"
            exit 1
          fi

      - name: Validate Hugo data
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          root = Path("data/vulns")
          bad = [f"missing {n}" for n in ("meta.json", "landscape.json") if not (root / n).is_file()]
          files = sorted(root.rglob("*")) if root.is_dir() else []
          for f in files:
              if f.is_dir():
                  continue
              if f.suffix != ".json":
                  bad.append(f"unexpected file {f}")
                  continue
              try:
                  json.loads(f.read_text(encoding="utf-8"))
              except (OSError, ValueError) as exc:
                  bad.append(f"{f}: {exc}")
          for msg in bad:
              print(f"::error::{msg}")
          print(f"validated {sum(1 for f in files if f.is_file())} files under {root}")
          sys.exit(1 if bad else 0)
          PY

      # The daily data job (daily-update.yml) also pushes to master and has no shared
      # concurrency group, so a push can race it: rebase onto the new master and retry twice.
      # Only data/vulns is touched here, so the rebase cannot conflict with its commits.
      - name: Commit and push data/vulns
        env:
          PUSH_TOKEN: ${{ secrets.DAILY_UPDATE_TOKEN }}
        run: |
          set -euo pipefail
          git add -A data/vulns
          if git diff --cached --quiet -- data/vulns; then
            echo "No changes in data/vulns"
            exit 0
          fi
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git commit -m "vulns update $(date -u +%Y-%m-%d)"
          remote="https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3; do
            if git push "$remote" HEAD:master; then
              echo "Pushed on attempt ${attempt}"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::push rejected (attempt ${attempt}); rebasing onto master"
              sleep $((attempt * 15))
              git pull --rebase --autostash "$remote" master
            fi
          done
          echo "::error::push failed after 3 attempts"
          exit 1
