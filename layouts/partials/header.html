<header class="header">
  <div class="header__inner">
    <div class="header__logo">
      <a href="{{ .Site.Home.RelPermalink }}" class="logo" aria-label="RBAC Atlas home">
        <span class="logo-icon" aria-hidden="true"><svg viewBox="0 0 40 40" fill="none"><path d="M20 2 37 20 20 38 3 20 20 2Z" stroke="currentColor" stroke-width="1.8"/><path d="m20 10 10 10-10 10-10-10 10-10Z" fill="currentColor"/><circle cx="20" cy="20" r="3" fill="var(--brand-mark-center)"/></svg></span>
        <div class="logo-text">
          <div class="title">
            <span class="title-line">RBAC</span>
            <span class="title-line">ATLAS</span>
          </div>
          <span class="tagline">KUBERNETES ACCESS INTELLIGENCE</span>
        </div>
      </a>
    </div>
    {{ partial "menu.html" . }}
    <div class="header__actions">
    <button class="theme-toggle" type="button" aria-label="Switch color mode" title="Switch color mode">
      <svg class="theme-toggle__sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>
      <svg class="theme-toggle__moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20.7 14.3A8.5 8.5 0 0 1 9.7 3.3 8.5 8.5 0 1 0 20.7 14.3Z"/></svg>
    </button>
    <button class="hamburger"
            id="hamburger-btn"
            aria-label="Open menu"
            aria-expanded="false"
            aria-controls="mobile-nav">
      <span class="hamburger__line"></span>
      <span class="hamburger__line"></span>
      <span class="hamburger__line"></span>
    </button>
    </div>
  </div>
  {{ partial "mobile-menu.html" . }}
  <div class="header__search"><span class="search-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg><span>Search the atlas</span></span>
  <link href="/pagefind/pagefind-ui.css" rel="stylesheet" />
  <script src="/pagefind/pagefind-ui.js"></script>
  <div id="search"></div>
  <script>
    window.addEventListener("DOMContentLoaded", () => {
      if (typeof PagefindUI !== 'undefined') new PagefindUI({ element: "#search", showSubResults: true });
    });
  </script>
  </div>
</header>
